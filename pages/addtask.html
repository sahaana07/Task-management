  <script>
    class Multiselect {
      constructor(selector) {
        this.element = document.querySelector(selector);
        this.title = this.element.querySelector(".title");
        this.container = this.element.querySelector(".container");
        this.text = this.element.querySelector(".text");
        this.options = this.container.querySelectorAll("option");
        this.selected = [];

        this.title.addEventListener("click", () => this.toggle());

        this.options.forEach((option) => {
          option.addEventListener("click", () => this.select(option));
        });
      }

      toggle() {
        this.element.classList.toggle("active");
      }

      select(option) {
        const value = option.textContent;
        const index = this.selected.indexOf(value);

        if (index === -1) {
          this.selected.push(value);
          option.style.fontWeight = "bold";
        } else {
          this.selected.splice(index, 1);
          option.style.fontWeight = "normal";
        }

        this.updateDisplay();
      }

      updateDisplay() {
        if (this.selected.length > 0) {
          this.text.textContent = this.selected.join(", ");
        } else {
          this.text.textContent = "Select";
        }
      }
    }

    $(document).ready(function () {
      new Multiselect("#countries");
    });
     $(document).ready(function () {
      new Multiselect("#icountries");
    });
    
  </script>
