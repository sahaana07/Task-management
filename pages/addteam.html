        font-size: medium;
        padding: 0px 10px;
        color: #6c757d;
        border: 1px solid #ced4da;
        border-radius: 4px;
        /* Remove default arrow */
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        /* Add custom arrow */

        background-position: right 10px center;
        background-size: 10px 5px;
    }
    select:required:invalid {
        color: rgb(198, 206, 224);
    }

    /* Style the options */
    select option {
        color: black;
    }
    .multiselect {
      width: 100%;
      border: 1px solid #ced4da;
      align-items: center;
      border-radius: 4px;
      position: relative;
      user-select: none;
      cursor: pointer;
      height: 38px;
      font-size: medium;
      padding: 0px 7px;
      color: black;
    }

    .multiselect .text {
  line-height: 38px; /* Matches the height of .multiselect */
  height: 38px;
  display: inline-block;
  vertical-align: middle;
}

    .multiselect .container {
      display: none;
      flex-direction: column;
      background: white;
      border: 1px solid #ccc;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      max-height: 150px;
      overflow-y: auto;
      z-index: 999;
    }

    .multiselect.active .container {
      display: flex;
    }

    .multiselect .container option {
        display: block;       /* Force vertical stacking */
        width: 100%;          /* Full width */
        padding: 5px 10px;
        cursor: pointer;
        white-space: nowrap;
    }

    .multiselect .container option:hover {
      background-color: #f1f1f1;
    }

    .multiselect .selected-items {
      margin-top: 5px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .multiselect .selected-item {
      background: #e2e6f0;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 12px;
    }
    .title{
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        padding-left:5px;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  class Multiselect {
    constructor(selector) {
      this.element = document.querySelector(selector);
      this.title = this.element.querySelector(".title");
      this.container = this.element.querySelector(".container");
      this.text = this.element.querySelector(".text");
      this.options = this.container.querySelectorAll("option");
      this.selected = [];

      this.title.addEventListener("click", () => this.toggle());

      this.options.forEach((option) => {
        option.addEventListener("click", () => this.select(option));
      });
    }

    toggle() {
      this.element.classList.toggle("active");
    }

    select(option) {
      const value = option.textContent;
      const index = this.selected.indexOf(value);

      if (index === -1) {
        this.selected.push(value);
        option.style.fontWeight = "bold";
      } else {
        this.selected.splice(index, 1);
        option.style.fontWeight = "normal";
      }

      this.updateDisplay();
    }

    updateDisplay() {
      if (this.selected.length > 0) {
        this.text.textContent = this.selected.join(", ");
      } else {
        this.text.textContent = "Select";
      }
    }
  }

  $(document).ready(function () {
    new Multiselect("#teamLeadSelect");
    new Multiselect("#teamMembersSelect");
  });
</script>
