

<html>
    <head>
        <title>HEADER NAVBAR</title>
    </head>
    <body>
        <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Navbar Stickied to the Top</title>
    <link href="./assests/assests/css/bootstrap.min.css" rel="stylesheet">
    <script src="./assests/assests/js/bootstrap.min.js"></script>
    <link href="https://fontawesome.com/">
    <script src="./assests/assests/js/main.js"></script>
    <link href="./assests/assests/css/main.css" rel="stylesheet">
    <script type='text/javascript' src='https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js'></script>
<script type='text/javascript' src='https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/js/bootstrap.min.js'></script>
</head>

<body>
   
   
            <nav class="navbar sticky-top navbar-expand-lg navbar-dark" style="background-color: #1e2a38">
    
        <div class="container-fluid">
            <a href="#" class="navbar-brand">
                
            </a>
            
            <a href="#" class="navbar-brand">Task-View</a>
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav">
                    <a href="#" class="nav-item nav-link active">Board</a>
                    <a href="#" class="nav-item nav-link"><i class="fa-solid fa-list"></i>List</a>
                    <a href="#" class="nav-item nav-link">Timeline</a>
                    
                   
                </div>

                <div class="navbar-nav ms-auto">
                    <div class="d-flex align-items-center">
     
      
     <ul class="navbar-nav ms-auto mb-2 mb-lg-0 profile-menu"> 
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <div class="profile-pic">
                <img src="./images/profile.png"  alt="Profile Picture">
             </div>
         
          </a>
          <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item" href="#"><i class="fas fa-sliders-h fa-fw"></i> Account</a></li>
            <li><a class="dropdown-item" href="#"><i class="fas fa-cog fa-fw"></i> Settings</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#"><i class="fas fa-sign-out-alt fa-fw"></i> Log Out</a></li>
          </ul>
        </li>
     </ul>
      
     
    

            </div>
        </div>
    </nav>
<script>
    document.querySelectorAll('.dropdown-toggle').forEach(item => {
  item.addEventListener('click', event => {
 
    if(event.target.classList.contains('dropdown-toggle') ){
      event.target.classList.toggle('toggle-change');
    }
    else if(event.target.parentElement.classList.contains('dropdown-toggle')){
      event.target.parentElement.classList.toggle('toggle-change');
    }
  })
})
</script>
    
</body>

</html>
