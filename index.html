<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Navbar Stickied to the Top</title>
    <link href="./assests/assests/css/bootstrap.min.css" rel="stylesheet">
   
    <script src="https://kit.fontawesome.com/013d690cc7.js" crossorigin="anonymous"></script>
    <link href="./assests/assests/css/main.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

    
</head>
<body>
   
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark custom-navbar nav" >
        <div class="container-fluid">
            <a href="#" class="navbar-brand">Task-View</a>
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav">

                    <a href="#" class="nav-item nav-link active me-lg-4" onclick="showContent('boardview') " >Board</a>  
                    <a href="#" class="nav-item nav-link me-lg-4" onclick="showContent('Listview')" ><i class="fa-solid fa-list me-2"></i>List</a>
                    <a href="#" class="nav-item nav-link me-lg-4" onclick="showContent('Timeline')" ><i class="fa-solid fa-timeline me-2"></i>Timeline</a>
                </div>
                

 
                
                
               
                <ul class=" navbar-nav ms-auto profile-menu ">
                   <li class="nav-item dropdown m-lg-3" >
        <button class="btn  position-relative noti-btn" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false" >
            <i class="fa-solid fa-bell"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                99+
                <span class="visually-hidden">unread messages</span>
            </span>
        </button>

        <ul class="dropdown-menu notification-ui_dd" aria-labelledby="dropdownMenuButton1">
            <li class="notification-ui_dd-header text-center fw-bold">Notifications</li>
            <li class="notification-ui_dd-content">
               <li></li>
            </li>
            <li class="notification-ui_dd-footer">
                <a href="#" class="btn btn-success w-100">View All</a>
            </li>
        </ul>
    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownLg" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="profile-pic">
                                <img src="./images/profile.png" alt="Profile Picture">
                            </div>
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownLg">
                            <li><a class="dropdown-item" href="#">Account</a></li>
                            <li><a class="dropdown-item" href="#">Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Log Out</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    
    <div id="boardview" class="view-section">Board View Content</div>
<div id="Listview" class="view-section d-none">List View Content</div>
<div id="Timeline" class="view-section d-none">Timeline View Content</div>


   
    <script src="./assests/assests/js/main.js">
       
  </script>
</body>
</html>
